import uk.gov.hmcts.rse.AuthMode
import uk.gov.hmcts.rse.CftlibExec

buildscript {
  repositories {
    mavenLocal()
    mavenCentral()
    maven {
      name = "AzureArtifacts"
      url = uri('https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1')
      content {
        excludeGroup "com.github.ben-manes.versions"
      }
    }

  }
  dependencies {
    classpath group: 'cz.habarta.typescript-generator', name: 'typescript-generator-gradle-plugin', version: '3.2.1263'
  }
}

plugins {
  id 'application'
  id 'checkstyle'
  id 'idea'
  id 'pmd'
  id 'jacoco'
  id 'org.owasp.dependencycheck' version '12.1.3'
  id 'org.sonarqube' version '6.3.1.5724'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.springframework.boot' version '3.5.10'
  id 'com.github.ben-manes.versions' version '0.50.0'
  id 'hmcts.ccd.sdk' version '6.8.1'
  id "au.com.dius.pact" version "4.3.10"
  // >= 0.19.2190 for RSE_LIB_XUI_ENV_*, which the -PlocalAuth stack needs to correct
  // XUI's expected IDAM issuer.
  id 'com.github.hmcts.rse-cft-lib' version '0.19.2315'
}

apply plugin: 'cz.habarta.typescript-generator'
apply plugin: 'com.github.ben-manes.versions'

group = 'uk.gov.hmcts'
version = '0.0.1'

ccd {
  configDir = file('ccd-definitions/definitions')
  decentralised = true
  caseEventServiceBus = true
}

project.tasks.named("generateCCDConfig") {
  environment 'SPRING_PROFILES_ACTIVE', 'config-gen'
  environment 'SPRING_FLYWAY_ENABLED', 'false'
  environment 'SPRING_JMS_SERVICEBUS_ENABLED', 'false'
  environment 'SPRING_DATASOURCE_URL', 'jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL'
  environment 'SPRING_DATASOURCE_USERNAME', 'sa'
  environment 'SPRING_DATASOURCE_PASSWORD', ''
  environment 'SPRING_JPA_HIBERNATE_DDL_AUTO', 'none'
}

sourceSets {
  functionalTest {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      srcDir file('src/functionalTest/java')
    }
  }
  integrationTest {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      srcDir file('src/integrationTest/java')
    }
  }
  contractTest {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      srcDir file('src/contractTest/java')
    }
    resources.srcDir file('src/contractTest/resources')
  }
}

ext{
  set('snakeyaml.version', '2.0')
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

idea {
  module {
    testSourceDirs += file('src/integrationTest/java')
    testSourceDirs += file('src/functionalTest/java')
  }
}

ext['elasticsearch.version'] = '7.16.3'

configurations {
  functionalTestImplementation.extendsFrom testImplementation
  functionalTestRuntime.extendsFrom testRuntime
  integrationTestImplementation.extendsFrom testImplementation
  integrationTestRuntime.extendsFrom testRuntime
  cftlibTestImplementation.extendsFrom testImplementation
  cftlibTestRuntime.extendsFrom testRuntime
}

tasks.withType(JavaCompile) {
  options.compilerArgs << "-Xlint:unchecked" << "-Werror"
}

// https://github.com/gradle/gradle/issues/16791
tasks.withType(JavaExec).configureEach {
  javaLauncher.set(javaToolchains.launcherFor(java.toolchain))
}

tasks.withType(Test) {
  useJUnitPlatform()
  maxParallelForks = Math.floorDiv(Runtime.runtime.availableProcessors(), 2)
  //Use more available processors for FT as WA Tests have timeouts and will run out of time
  if (System.getenv('WA_FUNCTIONAL_TESTS_ENABLED') == 'true') {
    maxParallelForks = Runtime.runtime.availableProcessors()
  }

  testLogging {
    exceptionFormat = 'full'
    events "PASSED", "FAILED", "SKIPPED"
  }
}

test {
  failFast = true
  useJUnitPlatform()
  jvmArgs = ['--add-opens=java.base/java.lang.reflect=ALL-UNNAMED','--add-opens=java.base/java.util=ALL-UNNAMED']
}

tasks.register('functional', Test) {
  description = "Runs functional tests"
  group = "Verification"
  testClassesDirs = sourceSets.functionalTest.output.classesDirs
  classpath = sourceSets.functionalTest.runtimeClasspath
  jvmArgs = ['--add-opens=java.base/java.lang.reflect=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED']
  environment 'SPRING_PROFILES_ACTIVE', 'functional'
  include "**/*FT.class"
  exclude "uk/gov/hmcts/sptribs/smoke/**"
}

task integration(type: Test) {
  description = "Runs integration tests"
  group = "Verification"
  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = sourceSets.integrationTest.runtimeClasspath
  failFast = true
  environment 'SPRING_PROFILES_ACTIVE', 'integration'
  systemProperty 'spring.profiles.active', 'integration'
  include "**/*IT.class"
}

// Invoked from CftLibConfig when booting with CCD.
tasks.register('buildCCDXlsx', Exec) {
  group 'ccd tasks'
  commandLine './bin/ccd-build-definition.sh'
  inputs.dir layout.buildDirectory.dir('definitions')
  outputs.dir layout.buildDirectory.dir('ccd-config')
}

tasks.register('smoke', Test) {
  description = "Runs Smoke Tests"
  setTestClassesDirs(sourceSets.functionalTest.output.classesDirs)
  setClasspath(sourceSets.functionalTest.runtimeClasspath)
  environment 'SPRING_PROFILES_ACTIVE', 'functional'
  include "uk/gov/hmcts/sptribs/smoke/**"
}

tasks.register('highLevelDataSetup', JavaExec) {
  mainClass.set("uk.gov.hmcts.sptribs.common.ccd.HighLevelDataSetupApp")
  classpath += sourceSets.main.runtimeClasspath
  jvmArgs = ['--add-opens=java.base/java.lang.reflect=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED']
}

tasks.register('fortifyScan', JavaExec) {
  mainClass.set("uk.gov.hmcts.fortifyclient.FortifyClientMainApp")
  classpath += sourceSets.test.runtimeClasspath
  jvmArgs = ['--add-opens=java.base/java.lang.reflect=ALL-UNNAMED']
}

checkstyle {
  maxWarnings = 0
  toolVersion = '9.3'
  getConfigDirectory().set(project.layout.projectDirectory.dir('config/checkstyle').asFile)
}

pmd {
  toolVersion = "7.21.0"
  sourceSets = [sourceSets.main]
  reportsDir = file("$project.buildDir/reports/pmd")
  // https://github.com/pmd/pmd/issues/876
  ruleSets = []
  ruleSetFiles = files(project.layout.projectDirectory.file('config/pmd/ruleset.xml'))
}

jacocoTestReport {
  executionData(test, integration)
  reports {
    xml.getRequired().set(true)
    csv.getRequired().set(false)
    xml.destination file("${buildDir}/reports/jacoco/test/jacocoTestReport.xml")
  }
}

// https://jeremylong.github.io/DependencyCheck/dependency-check-gradle/configuration.html
dependencyCheck {
  // Specifies if the build should be failed if a CVSS score above a specified level is identified.
  // range of 0-10 fails the build, anything greater and it doesn't fail the build
  failBuildOnCVSS = System.getProperty('dependencyCheck.failBuild') == 'true' ? 0 : 11
  suppressionFile = 'config/owasp/suppressions.xml'
  outputDirectory = 'build/reports/'
  scanConfigurations = ['runtimeClasspath']

  analyzers.assemblyEnabled = false     // Disable scanning of .NET related binaries
  analyzers.nodeAuditEnabled = false
}

if (System.getenv("CI") == null) {
  check.dependsOn integration
  integration.shouldRunAfter(test)
}
project.tasks['sonarqube'].dependsOn jacocoTestReport

