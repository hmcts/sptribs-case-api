def loadEnvSecretsTask = tasks.register('loadEnvSecrets') {
  doLast {
    if (!project.file('./.aat-env').exists()) {
      new ByteArrayOutputStream().withStream { os ->
        def azPath = ['which', 'az'].execute().text.trim()
        exec {
          commandLine azPath, 'keyvault', 'secret', 'show', '--vault-name', 'sptribs-aat', '-o', 'tsv', '--query', 'value', '--name', 'sptribs-case-api-dot-env'
          standardOutput = os
        }
        project.file('./.aat-env').write(new String(os.toString().replace('\n', '').decodeBase64(), java.nio.charset.StandardCharsets.UTF_8))
      }
    }
  }
}


def loadLocalEnvSecretsTask = tasks.register('loadLocalEnvSecrets') {
  doLast {
    if (!project.file('./.local-env').exists()) {
      new ByteArrayOutputStream().withStream { os ->
        def azPath = ['which', 'az'].execute().text.trim()
        exec {
          commandLine azPath, 'keyvault', 'secret', 'show', '--vault-name', 'sptribs-preview', '-o', 'tsv', '--query', 'value', '--name', 'sptribs-case-api-dot-env'
          standardOutput = os
          environment 'PATH', System.getenv('PATH')
        }
        project.file('./.local-env').write(new String(os.toString().replace('\n', '').decodeBase64(), java.nio.charset.StandardCharsets.UTF_8))
      }
    }
  }
}


def loadEnvFile = { task ->

  def envFile = project.file('./.local-env').exists()
    ? project.file('./.local-env')
    : project.file('./.aat-env').exists()
    ? project.file('./.aat-env')
    : null

  if (!envFile) {
    println "No env file found"
    return
  }

  println "Loading env from: ${envFile.name}"

  envFile.readLines().each { line ->

    line = line.trim()

    if (!line || line.startsWith("#") || !line.contains("=")) {
      return
    }

    def index = line.indexOf("=")
    def key = line.substring(0, index).trim()
    def value = line.substring(index + 1).trim()

    task.environment key, value
  }
}

tasks.register('reloadEnvSecrets') {
  dependsOn loadEnvSecretsTask
  doFirst {
    if (project.file('./.aat-env').exists()) {
      project.file('./.aat-env').delete()
    }
    if (project.file('./.local-env').exists()) {
      project.file('./.local-env').delete()
    }
  }
}

bootRun {
  dependsOn loadEnvSecretsTask
  doFirst() { loadEnvFile(it) }
}

